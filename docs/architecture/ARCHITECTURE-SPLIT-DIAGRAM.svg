<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" font-family="system-ui,'Microsoft YaHei','PingFang SC',sans-serif" viewBox="0 0 1280 1120"><defs><marker id="arrGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 1 L 9 5 L 0 9 z"/></marker><marker id="arrGray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#64748b" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs><rect width="1280" height="1120" x="0" y="0" fill="#fff"/><text x="40" y="42" fill="#111827" font-size="26" font-weight="bold">dsh-mattpocock-skills-deck · 源码拆分架构图</text><text x="42" y="66" fill="#4b5563" font-size="14">目标：多 session 并发开发时「各改各文件」→ 文件冲突趋近于零 · 一个真源 ├ 每模块一个文件 ├ 只准 import 内核 ├ 构建产物永不过手编辑</text><rect width="260" height="192" x="1008" y="92" fill="#f8fafc" stroke="#cbd5e1" rx="10"/><text x="1018" y="114" fill="#334155" font-size="13" font-weight="bold">图例</text><rect width="70" height="22" x="1018" y="124" fill="#fef9c3" stroke="#a16207" stroke-dasharray="4 3" rx="6"/><text x="1096" y="140" fill="#334155" font-size="12">内核：稳定接口·冻结</text><rect width="70" height="22" x="1018" y="152" fill="#dcfce7" stroke="#16a34a" rx="6"/><text x="1096" y="168" fill="#334155" font-size="12">一个模块 = 一组文件</text><line x1="1022" x2="1052" y1="192" y2="192" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGreen)"/><text x="1060" y="197" fill="#334155" font-size="12">唯一通道：import 内核</text><circle cx="1029" cy="222" r="10" fill="#fee2e2" stroke="#ef4444"/><text x="1029" y="227" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">✗</text><text x="1048" y="227" fill="#334155" font-size="12">同层不得互连</text><rect width="70" height="12" x="1018" y="240" fill="#e2e8f0" rx="3"/><text x="1096" y="251" fill="#334155" font-size="12">产物(人手不碰)</text><text x="1018" y="272" fill="#64748b" font-size="12">绿箭头 = 允许；红✗ = 禁止</text><rect width="950" height="46" x="40" y="88" fill="#f3f4f6" stroke="#9ca3af" rx="10"/><text x="515" y="118" fill="#374151" font-size="16" font-weight="bold" text-anchor="middle">src/ —— 仓库唯一真源（所有手写代码只在这里）</text><rect width="520" height="576" x="60" y="152" fill="#e0e7ff" stroke="#6366f1" rx="12"/><text x="78" y="180" fill="#312e81" font-size="17" font-weight="bold">src/host/ · 数据半（服务端逻辑，无界面）</text><text x="78" y="200" fill="#4338ca" font-size="12">只管 gh / 数据拉取 / 快照 / 环境检查；改它——重启 DSH 才生效</text><text x="88" y="232" fill="#1e1b4b" font-size="13" font-weight="bold">每个文件 = 一个独立小模块</text><g fill="#3730a3" font-size="12"><rect width="150" height="40" x="88" y="246" fill="#fff" stroke="#818cf8" rx="8"/><text x="163" y="271" text-anchor="middle">index.ts · 组装</text><rect width="150" height="40" x="250" y="246" fill="#fff" stroke="#818cf8" rx="8"/><text x="325" y="271" text-anchor="middle">gh.ts 命令行</text><rect width="150" height="40" x="412" y="246" fill="#fff" stroke="#818cf8" rx="8"/><text x="487" y="271" text-anchor="middle">repo.ts 缓存</text><rect width="150" height="40" x="88" y="302" fill="#fff" stroke="#818cf8" rx="8"/><text x="163" y="327" text-anchor="middle">snapshot.ts 快照</text><rect width="150" height="40" x="250" y="302" fill="#fff" stroke="#818cf8" rx="8"/><text x="325" y="327" text-anchor="middle">parser.ts 纯解析</text><rect width="150" height="40" x="412" y="302" fill="#fff" stroke="#818cf8" rx="8"/><text x="487" y="327" text-anchor="middle">checks.ts 环境检查</text><rect width="150" height="40" x="88" y="358" fill="#fff" stroke="#818cf8" rx="8"/><text x="163" y="383" text-anchor="middle">handoff.ts 交接</text><rect width="150" height="40" x="250" y="358" fill="#fff" stroke="#818cf8" rx="8"/><text x="325" y="383" text-anchor="middle">claim.ts 认领</text><rect width="150" height="40" x="412" y="358" fill="#fff" stroke="#818cf8" rx="8"/><text x="487" y="383" text-anchor="middle">rpc.ts 接口</text></g><text x="88" y="434" fill="#1e1b4b" font-size="13" font-weight="bold">▍怎么读懂它</text><text x="88" y="458" fill="#4338ca" font-size="12">· index.ts 负责把所有模块组装、注册 RPC，是 host 的唯一「门」</text><text x="88" y="480" fill="#4338ca" font-size="12">· 其余 8 个模块互不 import，谁也够不到别人的文件</text><text x="88" y="502" fill="#4338ca" font-size="12">· host 改动频率低，冲突风险小；重点别去碰「门」</text><rect width="640" height="576" x="610" y="152" fill="#fffbeb" stroke="#d97706" rx="12"/><text x="628" y="180" fill="#78350f" font-size="17" font-weight="bold">src/client/ · 界面半（UI，改它刷新浏览器即生效）</text><text x="628" y="200" fill="#92400e" font-size="12">一根「内核护栏」立在中间，四周四个模块组从它身上长出 —— 红✗两侧不许互相手拉手</text><rect width="165" height="455" x="625" y="215" fill="#fef9c3" stroke="#a16207" stroke-dasharray="6 4" rx="12"/><text x="707" y="240" fill="#854d0e" font-size="14" font-weight="bold" text-anchor="middle">kernel/ 内核</text><text x="707" y="257" fill="#a16207" font-size="11" text-anchor="middle">稳定接口 · 冻结</text><g fill="#713f12" font-size="11"><rect width="140" height="34" x="637" y="272" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="293" text-anchor="middle">store 状态</text><rect width="140" height="34" x="637" y="314" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="335" text-anchor="middle">locale 双语</text><rect width="140" height="34" x="637" y="356" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="377" text-anchor="middle">prompts 文案</text><rect width="140" height="34" x="637" y="398" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="419" text-anchor="middle">router 路由</text><rect width="140" height="34" x="637" y="440" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="461" text-anchor="middle">config 配置</text><rect width="140" height="34" x="637" y="482" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="503" text-anchor="middle">api host桥</text><rect width="140" height="34" x="637" y="524" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="545" text-anchor="middle">probe 刷新</text><rect width="140" height="34" x="637" y="566" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="587" text-anchor="middle">styles 样式</text><rect width="140" height="34" x="637" y="608" fill="#fefce8" stroke="#facc15" rx="7"/><text x="707" y="629" text-anchor="middle">icons 图标</text></g><text x="707" y="660" fill="#a16207" font-size="10" text-anchor="middle">这些是「公共插座」</text><rect width="388" height="112" x="845" y="215" fill="#dcfce7" stroke="#16a34a" rx="10"/><text x="860" y="236" fill="#14532d" font-size="14" font-weight="bold">statusbar/ 状态栏面板</text><g fill="#166534" font-size="11"><rect width="118" height="30" x="860" y="246" fill="#fff" stroke="#4ade80" rx="6"/><text x="919" y="265" text-anchor="middle">StatusBar.tsx</text><rect width="118" height="30" x="984" y="246" fill="#fff" stroke="#4ade80" rx="6"/><text x="1043" y="265" text-anchor="middle">Seg.tsx</text><rect width="118" height="30" x="1108" y="246" fill="#fff" stroke="#4ade80" rx="6"/><text x="1167" y="265" text-anchor="middle">EnvBadge.tsx</text><rect width="118" height="30" x="860" y="282" fill="#fff" stroke="#4ade80" rx="6"/><text x="919" y="301" text-anchor="middle">checksums.tsx</text><rect width="118" height="30" x="984" y="282" fill="#fff" stroke="#4ade80" rx="6"/><text x="1043" y="301" text-anchor="middle">runcard.tsx</text></g><text x="860" y="320" fill="#166534" font-size="10">胶囊 / 分段按钮 / 就绪徽标 各自一个文件</text><rect width="388" height="112" x="845" y="337" fill="#ede9fe" stroke="#7c3aed" rx="10"/><text x="860" y="358" fill="#3b0764" font-size="14" font-weight="bold">panel/ 右侧面板容器</text><g fill="#4c1d95" font-size="11"><rect width="118" height="30" x="860" y="368" fill="#fff" stroke="#a78bfa" rx="6"/><text x="919" y="387" text-anchor="middle">Tabs.tsx ★</text><rect width="118" height="30" x="984" y="368" fill="#fff" stroke="#a78bfa" rx="6"/><text x="1043" y="387" text-anchor="middle">TabsFold.tsx</text><rect width="118" height="30" x="1108" y="368" fill="#fff" stroke="#a78bfa" rx="6"/><text x="1167" y="387" text-anchor="middle">Tooltip.tsx</text><rect width="118" height="30" x="860" y="404" fill="#fff" stroke="#a78bfa" rx="6"/><text x="919" y="423" text-anchor="middle">Dock.tsx</text><rect width="118" height="30" x="984" y="404" fill="#fff" stroke="#a78bfa" rx="6"/><text x="1043" y="423" text-anchor="middle">Overlay.tsx</text><rect width="118" height="30" x="1108" y="404" fill="#fff" stroke="#a78bfa" rx="6"/><text x="1167" y="423" text-anchor="middle">Shell.tsx</text></g><text x="860" y="442" fill="#4c1d95" font-size="10">tab 标签行只写一份（原来 Dock + Overlay 重复两份）</text><rect width="388" height="112" x="845" y="459" fill="#cffafe" stroke="#0891b2" rx="10"/><text x="860" y="480" fill="#164e63" font-size="14" font-weight="bold">views/ 右侧面板内容</text><g fill="#155e75" font-size="11"><rect width="118" height="30" x="860" y="490" fill="#fff" stroke="#22d3ee" rx="6"/><text x="919" y="509" text-anchor="middle">ListTab.tsx</text><rect width="118" height="30" x="984" y="490" fill="#fff" stroke="#22d3ee" rx="6"/><text x="1043" y="509" text-anchor="middle">TicketRow.tsx</text><rect width="118" height="30" x="1108" y="490" fill="#fff" stroke="#22d3ee" rx="6"/><text x="1167" y="509" text-anchor="middle">MapDetail.tsx</text><rect width="118" height="30" x="860" y="526" fill="#fff" stroke="#22d3ee" rx="6"/><text x="919" y="545" text-anchor="middle">SkillsTab.tsx</text><rect width="118" height="30" x="984" y="526" fill="#fff" stroke="#22d3ee" rx="6"/><text x="1043" y="545" text-anchor="middle">ChecksTab.tsx</text><rect width="118" height="30" x="1108" y="526" fill="#fff" stroke="#22d3ee" rx="6"/><text x="1167" y="545" text-anchor="middle">Settings.tsx</text></g><text x="860" y="564" fill="#155e75" font-size="10">列表 / 技能 / 环境检查 / 地图详情 各占一个文件</text><rect width="388" height="112" x="845" y="581" fill="#fce7f3" stroke="#db2777" rx="10"/><text x="860" y="602" fill="#831843" font-size="14" font-weight="bold">floating/ 技能悬浮列表</text><g fill="#9d174d" font-size="11"><rect width="118" height="30" x="860" y="612" fill="#fff" stroke="#f472b6" rx="6"/><text x="919" y="631" text-anchor="middle">SkillFloat.tsx</text><rect width="118" height="30" x="984" y="612" fill="#fff" stroke="#f472b6" rx="6"/><text x="1043" y="631" text-anchor="middle">Pop.tsx</text><rect width="118" height="30" x="1108" y="612" fill="#fff" stroke="#f472b6" rx="6"/><text x="1167" y="631" text-anchor="middle">tagsFit.ts</text></g><text x="860" y="676" fill="#9d174d" font-size="10">悬浮列表 / 通用浮层 / 标签自适应</text><g fill="none" stroke="#16a34a" stroke-width="2.5"><line x1="833" x2="798" y1="264" y2="264" marker-end="url(#arrGreen)"/><line x1="833" x2="798" y1="386" y2="386" marker-end="url(#arrGreen)"/><line x1="833" x2="798" y1="508" y2="508" marker-end="url(#arrGreen)"/><line x1="833" x2="798" y1="630" y2="630" marker-end="url(#arrGreen)"/></g><text x="610" y="262" fill="#16a34a" font-size="11" font-weight="bold" text-anchor="end">每模块⇠只准 import 内核</text><circle cx="1039" cy="332" r="9" fill="#fee2e2" stroke="#ef4444"/><text x="1039" y="336" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">✗</text><circle cx="1039" cy="454" r="9" fill="#fee2e2" stroke="#ef4444"/><text x="1039" y="458" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">✗</text><circle cx="1039" cy="576" r="9" fill="#fee2e2" stroke="#ef4444"/><text x="1039" y="580" fill="#dc2626" font-size="12" font-weight="bold" text-anchor="middle">✗</text><text x="640" y="756" fill="#374151" font-size="16" font-weight="bold">构建：一源出两物 —— 人手只改 src/，产物由机器生成</text><rect width="130" height="62" x="611" y="772" fill="#e2e8f0" stroke="#475569" rx="10"/><text x="676" y="804" fill="#1e293b" font-size="15" font-weight="bold" text-anchor="middle">esbuild</text><text x="676" y="822" fill="#475569" font-size="10" text-anchor="middle">只看 src/，秒级</text><line x1="676" x2="676" y1="834" y2="858" stroke="#64748b" stroke-width="2"/><line x1="676" x2="430" y1="858" y2="876" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/><line x1="676" x2="880" y1="858" y2="876" stroke="#64748b" stroke-width="2" marker-end="url(#arrGray)"/><rect width="360" height="62" x="260" y="878" fill="#e2e8f0" stroke="#475569" rx="10"/><text x="440" y="904" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">package/lib/… ← 真实加载</text><text x="440" y="926" fill="#475569" font-size="11" text-anchor="middle">DSH 运行时用的就是它 · 构建生成，人手不碰</text><rect width="360" height="62" x="700" y="878" fill="#e2e8f0" stroke="#475569" rx="10"/><text x="880" y="904" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">client.js / host.js ← 动态开发版</text><text x="880" y="926" fill="#475569" font-size="11" text-anchor="middle">本地调试用 · 同源生成，不再人手同步</text><text x="640" y="982" fill="#334155" font-size="12">为什么要构建：DSH 只认「一插件 = 一个 bundle 文件」，所以「多个源文件」必须经构建合并成一个，源文件才能各拆各的。</text><rect width="390" height="100" x="40" y="1004" fill="#eff6ff" stroke="#3b82f6" rx="10"/><text x="55" y="1026" fill="#1e3a8a" font-size="14" font-weight="bold">① 结构（是什么样）</text><text x="55" y="1048" fill="#1e40af" font-size="12">· 仓库只有一个真源 src/，分「数据半 host + 界面半 client」</text><text x="55" y="1066" fill="#1e40af" font-size="12">· 界面里立一根「内核护栏」，四周长四个模块组</text><text x="55" y="1084" fill="#1e40af" font-size="12">· 每个模块 = 一个文件（+ 一个专属测试文件）</text><rect width="390" height="100" x="445" y="1004" fill="#f0fdf4" stroke="#22c55e" rx="10"/><text x="460" y="1026" fill="#14532d" font-size="14" font-weight="bold">② 为什么这样拆</text><text x="460" y="1048" fill="#166534" font-size="12">· DSH 只认单 bundle → 想多文件只能「src/ + 构建」</text><text x="460" y="1066" fill="#166534" font-size="12">· 同层互相 import = 隐式耦合 → 拆成「只通内核」的单向通道</text><text x="460" y="1084" fill="#166534" font-size="12">· 手写双镜像 = 冲突×2 → 交给构建统一产出</text><rect width="390" height="100" x="850" y="1004" fill="#fefce8" stroke="#eab308" rx="10"/><text x="865" y="1026" fill="#713f12" font-size="14" font-weight="bold">③ 好处（对你的意义）</text><text x="865" y="1048" fill="#854d0e" font-size="12">· 并发趋零：多个 AI session 各改各文件，互不冲突</text><text x="865" y="1066" fill="#854d0e" font-size="12">· 重复代码只写一处（如 tab 标签行），不会两处失步</text><text x="865" y="1084" fill="#854d0e" font-size="12">· 测试按模块隔离；构建产物永不手编</text></svg>