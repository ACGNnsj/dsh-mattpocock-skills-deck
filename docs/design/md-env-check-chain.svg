 YaHei','Segoe UI',sans-serif" font-size="16" font-weight="bold" text-anchor="middle">2</text><text x="126" y="573" fill="#065f46" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="17" font-weight="bold">md:scratchWritable</text><text x="126" y="593" fill="#047857" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="normal">数据目录可写</text><text x="1400" y="585" fill="#4b5563" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="14" font-weight="normal" text-anchor="end">问：现在能不能写票？</text><rect width="28" height="28" x="84" y="613" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" rx="8"/><line x1="90" x2="96" y1="628" y2="634" stroke="#16a34a" stroke-linecap="round" stroke-width="2.6"/><line x1="96" x2="107" y1="634" y2="620" stroke="#16a34a" stroke-linecap="round" stroke-width="2.6"/><text x="126" y="632" fill="#374151" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">.scratch 可写</text><rect width="28" height="28" x="84" y="649" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3" rx="8"/><line x1="90" x2="96" y1="664" y2="670" stroke="#16a34a" stroke-linecap="round" stroke-width="2.6"/><line x1="96" x2="107" y1="670" y2="656" stroke="#16a34a" stroke-linecap="round" stroke-width="2.6"/><text x="126" y="668" fill="#374151" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">没有 .scratch，但仓库根可写（首票自动创建）</text><rect width="28" height="28" x="84" y="685" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3" rx="8"/><line x1="91" x2="105" y1="692" y2="706" stroke="#dc2626" stroke-linecap="round" stroke-width="2.6"/><line x1="105" x2="91" y1="692" y2="706" stroke="#dc2626" stroke-linecap="round" stroke-width="2.6"/><text x="126" y="704" fill="#374151" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">目录不可写，或仓库根不可写</text><rect width="28" height="28" x="84" y="721" fill="#f8fafc" stroke="#94a3b8" stroke-width