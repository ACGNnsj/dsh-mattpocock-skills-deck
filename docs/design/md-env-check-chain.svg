<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1678" viewBox="0 0 1560 1678"><defs><marker id="ah" markerHeight="5" markerWidth="5" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#cbd5e1" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="1560" height="1678" fill="#fff"/><rect width="1560" height="156" x="0" y="0" fill="#fff" rx="10"/><rect width="1560" height="6" x="0" y="0" fill="#2563eb"/><text x="60" y="58" fill="#1f2937" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="32" font-weight="bold">md 环境检查链（按检查顺序）</text><text x="60" y="92" fill="#4b5563" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">灰色 = 通用段（不变） 绿色 = md 段 红色 = 删掉的旧检查</text><line x1="60" x2="66" y1="125" y2="131" stroke="#16a34a" stroke-linecap="round" stroke-width="2.6"/><line x1="66" x2="77" y1="131" y2="117" stroke="#16a34a" stroke-linecap="round" stroke-width="2.6"/><text x="84" y="130" fill="#4b5563" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">通过</text><line x1="149" x2="163" y1="117" y2="131" stroke="#dc2626" stroke-linecap="round" stroke-width="2.6"/><line x1="163" x2="149" y1="117" y2="131" stroke="#dc2626" stroke-linecap="round" stroke-width="2.6"/><text x="172" y="130" fill="#4b5563" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">失败</text><circle cx="244" cy="124" r="7" fill="#6b7280"/><text x="260" y="130" fill="#4b5563" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="normal">量不出来</text><rect width="1440" height="96" x="60" y="178" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.6" rx="12"/><text x="84" y="210" fill="#374151" font-family="'Microsoft YaHei','Segoe UI',sans-serif" font-size="16" font-weight="bold">通用段（4 项，所有后端都一样）</text><rect width="84" height="32" x="84" y="228" fill="#fff" stroke="#9ca3af" stroke-width="1.3" rx="8"/><text x="96" y="250" fill="#37