<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"><defs><radialGradient id="hO" cx="15%" cy="0%" r="65%"><stop offset="0%" stop-color="#FAB283" stop-opacity=".22"/><stop offset="100%" stop-color="#FAB283" stop-opacity="0"/></radialGradient><radialGradient id="hV" cx="88%" cy="5%" r="60%"><stop offset="0%" stop-color="#9D7CD8" stop-opacity=".2"/><stop offset="100%" stop-color="#9D7CD8" stop-opacity="0"/></radialGradient><radialGradient id="hT" cx="45%" cy="105%" r="70%"><stop offset="0%" stop-color="#56B6C2" stop-opacity=".14"/><stop offset="100%" stop-color="#56B6C2" stop-opacity="0"/></radialGradient><linearGradient id="tG" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#FAB283"/><stop offset="50%" stop-color="#9D7CD8"/><stop offset="100%" stop-color="#56B6C2"/></linearGradient><linearGradient id="cardG" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#15151c"/><stop offset="100%" stop-color="#0d0d12"/></linearGradient><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".55" stdDeviation="16"/></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#fff" opacity=".05"/></pattern></defs><rect width="100%" height="100%" fill="#0a0a0c"/><rect width="100%" height="100%" fill="url(#hO)"/><rect width="100%" height="100%" fill="url(#hV)"/><rect width="100%" height="100%" fill="url(#hT)"/><rect width="100%" height="100%" fill="url(#dots)"/><text x="640" y="40" fill="#5c5c66" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" letter-spacing="5" text-anchor="middle">DEEPSEEK HARNESS · MATTSKILLS</text><text x="640" y="100" fill="url(#tG)" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="38" font-weight="800" letter-spacing="1" text-anchor="middle">它是什么</text><text x="640" y="132" fill="#8a8a94" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" text-anchor="middle">AI 会聊天，但活儿要有人盯。MattSkills 把工程技能接到 DSH 面板上，让 AI 按流程把 issue 干完。</text><g filter="url(#glow)"><rect width="380" height="150" x="60" y="164" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="116" cy="224" r="27" fill="#9D7CD8" opacity=".16"/><circle cx="116" cy="224" r="13" fill="none" stroke="#9D7CD8" stroke-dasharray="62 20" stroke-width="2.6"/><circle cx="116" cy="224" r="4" fill="#9D7CD8"/><text x="156" y="216" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="700">wayfinder 决策地图</text><text x="156" y="244" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">map 全量落地、子票进度圆环，</text><text x="156" y="268" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">frontier / 阻塞 / 已关闭一目了然</text></g><g filter="url(#glow)"><rect width="380" height="150" x="450" y="164" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="506" cy="224" r="27" fill="#FAB283" opacity=".16"/><circle cx="506" cy="224" r="13" fill="none" stroke="#FAB283" stroke-width="2.6"/><circle cx="506" cy="224" r="6" fill="none" stroke="#FAB283" stroke-width="2"/><circle cx="506" cy="224" r="2.5" fill="#FAB283"/><text x="546" y="216" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="700">动作注入</text><text x="546" y="244" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">按标签四选一：诊断 / 修复 / 讨论 / 执行，</text><text x="546" y="268" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">统一带「第一性原理 + 对抗式审查」引导句</text></g><g filter="url(#glow)"><rect width="380" height="150" x="840" y="164" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="896" cy="224" r="27" fill="#56B6C2" opacity=".16"/><circle cx="896" cy="224" r="13" fill="none" stroke="#56B6C2" stroke-width="2.2"/><path fill="none" stroke="#56B6C2" stroke-width="2.6" d="M896 211a13 13 0 0 1 0 26"/><path stroke="#56B6C2" stroke-width="1.2" d="M896 211v26M883 224h26" opacity=".6"/><text x="936" y="216" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="700">技能雷达</text><text x="936" y="244" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">25 个技能推荐 / 列表 / 圆环，</text><text x="936" y="268" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">点击注入 /skill</text></g><g filter="url(#glow)"><rect width="380" height="150" x="60" y="330" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="116" cy="390" r="27" fill="#4ADE80" opacity=".14"/><circle cx="104" cy="382" r="5" fill="#4ADE80"/><circle cx="116" cy="390" r="5" fill="#FACC15"/><circle cx="128" cy="398" r="5" fill="#EF4444"/><text x="156" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="700">环境检查</text><text x="156" y="410" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">9 项前置检查，红黄绿分组，</text><text x="156" y="434" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">依赖链引导（gh → 登录 → setup → 技能）</text></g><g filter="url(#glow)"><rect width="380" height="150" x="450" y="330" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="506" cy="390" r="27" fill="#FAB283" opacity=".16"/><path stroke="#FAB283" stroke-linecap="round" stroke-width="2.6" d="M494 382h24M494 398h24"/><path fill="none" stroke="#FAB283" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M512 376l8 6-8 6M512 392l8 6-8 6"/><text x="546" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="700">交接</text><text x="546" y="410" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">/handoff 时间戳模板 → 复述确认，</text><text x="546" y="434" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">开新会话上下文不丢</text></g><g filter="url(#glow)"><rect width="380" height="150" x="840" y="330" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="896" cy="390" r="27" fill="#9D7CD8" opacity=".16"/><rect width="20" height="24" x="886" y="378" fill="none" stroke="#9D7CD8" stroke-width="2.2" rx="5"/><text x="896" y="395" fill="#9D7CD8" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="15" font-weight="700" text-anchor="middle">中</text><rect width="20" height="24" x="906" y="378" fill="#1a1a24" stroke="#9D7CD8" stroke-width="1.2" rx="5"/><text x="916" y="395" fill="#9D7CD8" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle">EN</text><text x="936" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18" font-weight="700">全量中英双语</text><text x="936" y="410" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">面板跟随 DSH 界面语言，</text><text x="936" y="434" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="14">中英即时切换</text></g></svg>