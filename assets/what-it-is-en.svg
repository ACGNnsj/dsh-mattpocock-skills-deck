<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"><defs><radialGradient id="hO" cx="15%" cy="0%" r="65%"><stop offset="0%" stop-color="#FAB283" stop-opacity=".22"/><stop offset="100%" stop-color="#FAB283" stop-opacity="0"/></radialGradient><radialGradient id="hV" cx="88%" cy="5%" r="60%"><stop offset="0%" stop-color="#9D7CD8" stop-opacity=".2"/><stop offset="100%" stop-color="#9D7CD8" stop-opacity="0"/></radialGradient><radialGradient id="hT" cx="45%" cy="105%" r="70%"><stop offset="0%" stop-color="#56B6C2" stop-opacity=".14"/><stop offset="100%" stop-color="#56B6C2" stop-opacity="0"/></radialGradient><linearGradient id="tG" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#FAB283"/><stop offset="50%" stop-color="#9D7CD8"/><stop offset="100%" stop-color="#56B6C2"/></linearGradient><linearGradient id="cardG" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#15151c"/><stop offset="100%" stop-color="#0d0d12"/></linearGradient><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feDropShadow dx="0" dy="10" flood-color="#000" flood-opacity=".55" stdDeviation="16"/></filter><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#fff" opacity=".05"/></pattern></defs><rect width="100%" height="100%" fill="#0a0a0c"/><rect width="100%" height="100%" fill="url(#hO)"/><rect width="100%" height="100%" fill="url(#hV)"/><rect width="100%" height="100%" fill="url(#hT)"/><rect width="100%" height="100%" fill="url(#dots)"/><text x="640" y="40" fill="#5c5c66" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" letter-spacing="5" text-anchor="middle">DEEPSEEK HARNESS · MATTSKILLS</text><text x="640" y="100" fill="url(#tG)" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="38" font-weight="800" letter-spacing="1" text-anchor="middle">What it is</text><text x="640" y="132" fill="#8a8a94" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" text-anchor="middle">Matt&apos;s skills, plugged into DSH — so AI works through real issues, step by step</text><g filter="url(#glow)"><rect width="380" height="150" x="60" y="164" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="116" cy="224" r="27" fill="#9D7CD8" opacity=".16"/><circle cx="116" cy="224" r="13" fill="none" stroke="#9D7CD8" stroke-dasharray="62 20" stroke-width="2.6"/><circle cx="116" cy="224" r="4" fill="#9D7CD8"/><text x="156" y="216" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">wayfinder decision maps</text><text x="156" y="244" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">Full map support, sub-task rings —</text><text x="156" y="268" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">frontier, blocked and closed at a glance</text></g><g filter="url(#glow)"><rect width="380" height="150" x="450" y="164" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="506" cy="224" r="27" fill="#FAB283" opacity=".16"/><circle cx="116" cy="224" r="13" fill="none" stroke="#FAB283" stroke-width="2.6"/><circle cx="116" cy="224" r="6" fill="none" stroke="#FAB283" stroke-width="2"/><circle cx="116" cy="224" r="2.5" fill="#FAB283"/><text x="546" y="216" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">action injection</text><text x="546" y="244" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">Pick by label: diagnose / fix / discuss / run,</text><text x="546" y="268" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">with a first-principles + adversarial-review note</text></g><g filter="url(#glow)"><rect width="380" height="150" x="840" y="164" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="896" cy="224" r="27" fill="#56B6C2" opacity=".16"/><circle cx="116" cy="224" r="13" fill="none" stroke="#56B6C2" stroke-width="2.2"/><path fill="none" stroke="#56B6C2" stroke-width="2.6" d="M116 211a13 13 0 0 1 0 26"/><path stroke="#56B6C2" stroke-width="1.2" d="M116 211v26M103 224h26" opacity=".6"/><text x="936" y="216" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">skill radar</text><text x="936" y="244" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">25 skills: recommended / list / ring,</text><text x="936" y="268" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">one click injects /skill</text></g><g filter="url(#glow)"><rect width="380" height="150" x="60" y="330" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="116" cy="390" r="27" fill="#4ADE80" opacity=".16"/><circle cx="106" cy="224" r="5" fill="#4ADE80"/><circle cx="116" cy="224" r="5" fill="#FACC15"/><circle cx="126" cy="224" r="5" fill="#EF4444"/><text x="156" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">env check</text><text x="156" y="410" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">9 pre-checks, green / amber / red,</text><text x="156" y="434" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">guided: gh → login → setup → skills</text></g><g filter="url(#glow)"><rect width="380" height="150" x="450" y="330" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="506" cy="390" r="27" fill="#FAB283" opacity=".16"/><path stroke="#FAB283" stroke-linecap="round" stroke-width="2.6" d="M104 224h24"/><path fill="none" stroke="#FAB283" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M122 217l8 7-8 7"/><text x="546" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">handoff</text><text x="546" y="410" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">/handoff timestamp → confirm → new session,</text><text x="546" y="434" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">context never lost</text></g><g filter="url(#glow)"><rect width="380" height="150" x="840" y="330" fill="url(#cardG)" stroke="#26262f" rx="14"/><circle cx="896" cy="390" r="27" fill="#9D7CD8" opacity=".16"/><rect width="20" height="24" x="106" y="212" fill="none" stroke="#9D7CD8" stroke-width="2.2" rx="5"/><text x="116" y="228" fill="#9D7CD8" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">A</text><text x="936" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700">bilingual</text><text x="936" y="410" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">Follows the DSH language,</text><text x="936" y="434" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5">switch anytime</text></g></svg>