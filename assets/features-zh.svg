="10"/><circle cx="96" cy="317" r="13" fill="none" stroke="#56B6C2" stroke-width="2.2"/><path fill="none" stroke="#56B6C2" stroke-width="2.6" d="M96 304a13 13 0 0 1 0 26"/><path stroke="#56B6C2" stroke-width="1" d="M96 304v26M83 317h26" opacity=".5"/><text x="134" y="320" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="700">面板 · 技能</text><text x="250" y="320" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18.5">技能雷达（推荐 / 列表 / 圆环），点击注入 /skill</text></g><g filter="url(#glow)"><rect width="1160" height="54" x="60" y="352" fill="url(#cardG)" stroke="#26262f" rx="12"/><rect width="40" height="40" x="76" y="359" fill="#4ADE80" opacity=".12" rx="10"/><circle cx="86" cy="379" r="5" fill="#4ADE80"/><circle cx="96" cy="379" r="5" fill="#FACC15"/><circle cx="106" cy="379" r="5" fill="#EF4444"/><text x="134" y="382" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="700">面板 · 环境检查</text><text x="250" y="382" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18.5">9 项前置检查 + 一键处理 + 引导依赖链，完成自动勾选</text></g><g filter="url(#glow)"><rect width="1160" height="54" x="60" y="414" fill="url(#cardG)" stroke="#26262f" rx="12"/><rect width="40" height="40" x="76" y="421" fill="#FAB283" opacity=".12" rx="10"/><circle cx="96" cy="441" r="13" fill="none" stroke="#FAB283" stroke-dasharray="62 20" stroke-width="2.4"/><path fill="#FAB283" d="M94 435l4 6 6-1-3 7 1 6-8-3-8 3 1-6-3-7 6 1z" opacity=".85"/><text x="134" y="444" fill="#f0f0f6" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="17" font-weight="700">map 详情</text><text x="250" y="444" fill="#b8b8c2" font-family="-apple-system,Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="18.5">顶部「执行」+ 任务状态走廊（可接 / 已认领 / 被阻塞 / 已关闭）、Decision / Fog / Out-of-scope 折叠</t